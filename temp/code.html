<style>
        body { font-family: 'Inter', sans-serif; }
        .timer-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-variant-numeric: tabular-nums; }

<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden">
<!-- Progress Bar -->
<div class="h-2 w-full bg-surface-variant sticky top-0 z-50">
<div class="h-full bg-on-tertiary-container w-1/3 transition-all duration-300"></div>
</div>
<!-- TopNavBar Shell -->
<nav class="bg-surface w-full sticky top-0 border-b border-outline-variant flat no shadows flex justify-between items-center h-16 px-margin-desktop max-w-container-max-width mx-auto">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-primary">TKA Pro Platform</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80">notifications</span>
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80">help</span>
</div>
</nav>
<!-- Main Layout -->
<main class="flex-1 flex overflow-hidden max-w-container-max-width mx-auto w-full px-margin-desktop py-gutter gap-gutter">
<!-- Main Content Area (8 columns) -->
<div class="flex-1 lg:w-2/3 flex flex-col h-full bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden flex flex-col shadow-sm">
<!-- Section Header -->
<div class="px-8 py-6 border-b border-outline-variant bg-surface-bright flex justify-between items-center">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Section: Mathematics</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Question 12 of 40</p>
</div>
</div>
<!-- Question Area -->
<div class="p-8 flex-1 overflow-y-auto">
<div class="mb-8">
<p class="font-body-lg text-body-lg text-on-surface">
                        Find the derivative of the function \( f(x) = 3x^4 - 2x^2 + 5x - 7 \) with respect to \( x \).
                    </p>
</div>
<!-- Options -->
<div class="space-y-4">
<label class="flex items-start p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center h-6">
<input class="w-5 h-5 text-secondary border-outline focus:ring-secondary" name="answer" type="radio">
</div>
<div class="ml-4">
<span class="font-body-md text-body-md text-on-surface font-medium mr-2">A.</span>
<span class="font-body-md text-body-md text-on-surface">\( f'(x) = 12x^3 - 4x + 5 \)</span>
</div>
</label>
<label class="flex items-start p-4 border-2 border-secondary bg-surface-container-low rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center h-6">
<input checked="" class="w-5 h-5 text-secondary border-outline focus:ring-secondary" name="answer" type="radio">
</div>
<div class="ml-4">
<span class="font-body-md text-body-md text-on-surface font-medium mr-2">B.</span>
<span class="font-body-md text-body-md text-on-surface">\( f'(x) = 12x^3 - 4x - 5 \)</span>
</div>
</label>
<label class="flex items-start p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center h-6">
<input class="w-5 h-5 text-secondary border-outline focus:ring-secondary" name="answer" type="radio">
</div>
<div class="ml-4">
<span class="font-body-md text-body-md text-on-surface font-medium mr-2">C.</span>
<span class="font-body-md text-body-md text-on-surface">\( f'(x) = 4x^3 - 2x + 5 \)</span>
</div>
</label>
<label class="flex items-start p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center h-6">
<input class="w-5 h-5 text-secondary border-outline focus:ring-secondary" name="answer" type="radio">
</div>
<div class="ml-4">
<span class="font-body-md text-body-md text-on-surface font-medium mr-2">D.</span>
<span class="font-body-md text-body-md text-on-surface">\( f'(x) = 3x^3 - 4x + 5 \)</span>
</div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="p-6 border-t border-outline-variant bg-surface-bright flex justify-between items-center">
<button class="flex items-center gap-2 px-4 py-2 border border-outline-variant rounded text-on-surface-variant hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">flag</span>
<span class="font-label-md text-label-md">Flag for Review</span>
</button>
<div class="flex gap-4">
<button class="px-6 py-2 border border-secondary text-secondary rounded font-label-md text-label-md hover:bg-secondary-fixed transition-colors">

<button class="px-6 py-2 bg-secondary text-on-secondary rounded font-label-md text-label-md hover:opacity-90 transition-opacity">
                        Next Question
                    </button>
</div>
</div>
</div>

<span class="font-label-md text-label-md text-on-surface-variant mb-2">Time Remaining</span>
<div class="text-4xl font-semibold text-primary timer-font tracking-tight">01:42:15</div>
</div>

<div class="p-4 border-b border-outline-variant bg-surface-bright">
<h3 class="font-label-md text-label-md text-on-surface font-semibold">Question Map</h3>
</div>
<div class="p-4 flex-1 overflow-y-auto">
<div class="grid grid-cols-5 gap-2">
<!-- Answered -->

<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">3</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">4</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">5</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">6</div>
<!-- Flagged -->
<div class="aspect-square border border-error text-error flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm relative">
                            7

</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">8</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">9</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">10</div>
<div class="aspect-square bg-secondary text-on-secondary flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm">11</div>

<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">14</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">15</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">16</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">17</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">18</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">19</div>
<div class="aspect-square border border-outline-variant bg-surface text-on-surface-variant flex items-center justify-center rounded cursor-pointer font-label-sm text-label-sm hover:bg-surface-container-low">20</div>
</div>
</div>
<div class="p-4 border-t border-outline-variant bg-surface-bright flex flex-col gap-2">
<div class="flex items-center gap-2">
<div class="w-3 h-3 bg-secondary rounded"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Answered</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 border border-outline-variant rounded"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Unanswered</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 border border-error rounded relative"><div class="absolute -top-0.5 -right-0.5 w-1 h-1 bg-error rounded-full"></div></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Flagged</span>
</div>
</div>
</div>
<!-- Finish Exam Button -->
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm">
                Finish Exam
            </button>
</aside>
</main>
</body></html>
