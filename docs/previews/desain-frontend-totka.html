function login(){const r=roles[loginRole];return publicNav()+`<main class="login-wrap"><section class="login-story"><span class="stat-icon" style="width:47px;height:47px">${icon(loginRole==='siswa'?'book':'grid')}</span><h1>Selamat datang<br>di workspace Anda.</h1><p>Persiapan yang baik dimulai dari langkah yang teratur. Masuk dan lanjutkan kegiatan try out Anda bersama TOTKA.</p>${notice(loginRole==='siswa'?'Gunakan username/NISN dan password pada kartu login dari sekolah. Token paket dimasukkan setelah berhasil login.':'Gunakan akun yang telah diberikan pengelola sistem atau sekolah Anda.')}</section><section class="login-panel"><span class="tag">${r.title}</span><h2>Masuk ke TOTKA</h2><p>Silakan masukkan kredensial akun Anda.</p><form id="login-form"><label>Peran akses<select id="login-role">${Object.entries(roles).map(([id,v])=>`<option value="${id}" ${id===loginRole?'selected':''}>${v.title}</option>`).join('')}</select></label><label>Username / NISN<input name="username" placeholder="Masukkan username atau NISN" autocomplete="off" required></label><label for="password-input">Password</label><div class="password-wrap"><input id="password-input" type="password" placeholder="Masukkan password" autocomplete="off" required><button type="button" data-action="togglePassword" aria-label="Tampilkan password">${icon('eye')}</button></div>${button('Masuk ke sistem','arrow','type="submit"',true)}<button type="button" class="back" data-public>Kembali ke beranda</button></form><p style="margin:25px 0 0;font-size:10px;line-height:1.8">Pratinjau desain: isi bebas untuk mencoba alur. Form ini tidak mengirim atau menyimpan kredensial.</p></section></main>`}
function studentStart(){return `<div class="student-hero"><div><div class="eyebrow">WORKSPACE SISWA</div><h1>Halo, Ahmad Fadli.</h1><p>Siapkan dirimu, lalu masukkan token untuk memulai try out.</p></div><span class="stat-icon">${icon('book')}</span></div><div class="two-col"><section class="card accent"><div class="card-head"><div><h2>Mulai try out</h2><p>Token paket diberikan oleh operator sekolah.</p></div>${icon('edit')}</div><div class="card-body"><form id="token-form"><label for="exam-token">Token ujian</label><input id="exam-token" class="token-input" placeholder="TOKEN" maxlength="12" autocomplete="off" required><div class="row" style="font-size:10px;color:#91a2b8;margin-bottom:20px">${icon('info')}Contoh pratinjau: masukkan BIND26.</div>${button('Mulai kerjakan','arrow','type="submit" style="width:100%;min-height:42px"',true)}</form></div></section><section class="card"><div class="card-head"><h2>Identitas peserta</h2>${tag('Siswa')}</div><div class="card-body"><div class="row" style="margin-bottom:23px"><span class="avatar" style="width:45px;height:45px;font-size:14px">AF</span><div><h3>Ahmad Fadli</h3><small class="muted">Peserta try out TKA</small></div></div><dl class="detail-list"><dt>NISN</dt><dd class="mono">0000123401</dd><dt>Kelas</dt><dd>VI A</dd><dt>Sekolah</dt><dd>${school}</dd></dl><div class="gap">${notice('Jika identitas belum sesuai, hubungi operator sekolah sebelum memulai ujian.')}</div></div></section></div><section class="card gap"><div class="card-head"><h2>Sebelum mulai</h2></div><div class="card-body"><div class="quick-grid">${[['01','Periksa identitas','Pastikan nama, NISN, kelas, dan sekolah sudah sesuai.'],['02','Siapkan koneksi','Gunakan perangkat dan koneksi internet yang stabil.'],['03','Baca petunjuk','Perhatikan durasi dan petunjuk pada setiap tipe soal.']].map(([n,t,d])=>`<div class="instructions" style="margin:0"><div><b>${n}</b><span><strong>${t}</strong>${d}</span></div></div>`).join('')}</div></div></section>`}
function studentProfile(){return heading('Profil siswa','Periksa identitas yang digunakan dalam pelaksanaan try out.','','SISWA')+`<section class="card" style="max-width:700px"><div class="card-head"><div class="row"><span class="avatar">AF</span><h2>Ahmad Fadli</h2></div>${tag('Siswa')}</div><div class="card-body"><dl class="detail-list"><dt>Nama lengkap</dt><dd>Ahmad Fadli</dd><dt>NISN</dt><dd class="mono">0000123401</dd><dt>Kelas</dt><dd>VI A</dd><dt>Sekolah</dt><dd>${school}</dd><dt>NPSN</dt><dd class="mono">20101234</dd></dl><div class="gap">${notice('Perubahan identitas dilakukan melalui operator sekolah.')}</div></div></section>`}
function examIdentity(){return `<section class="card"><div class="card-head"><h2>Peserta ujian</h2>${icon('shield')}</div><div class="card-body"><div class="row" style="margin-bottom:18px"><span class="avatar">AF</span><strong style="font-size:12px">Ahmad Fadli</strong></div><dl class="detail-list" style="font-size:11px;gap:10px"><dt>NISN</dt><dd class="mono">0000123401</dd><dt>Kelas</dt><dd>VI A</dd><dt>Sekolah</dt><dd>${school}</dd></dl></div></section><section class="card gap"><div class="card-head"><h2>Navigasi soal</h2><small class="muted">${Object.keys(answers).length}/25</small></div><div class="card-body"><div class="progress-track"><span style="width:${Object.keys(answers).length/25*100}%"></span></div><div class="exam-number-grid">${Array.from({length:25},(_,i)=>`<button data-question="${i+1}" class="${answers[i+1]!==undefined?'done ':''}${review.has(i+1)?'marked ':''}${examNumber===i+1?'current':''}" aria-label="Soal ${i+1}" ${examNumber===i+1?'aria-current="step"':''}>${String(i+1).padStart(2,'0')}</button>`).join('')}</div><div class="row wrap" style="font-size:9px;color:#8da1bb"><span>● Biru: terjawab</span><span>● Kuning: ditandai</span></div><div class="gap">${button('Periksa & selesaikan','check','data-action="finish" style="width:100%"',true)}</div></div></section>`}
function exam(){return `<div class="exam-top">${brand()}<div class="exam-package"><h2>Try Out Bahasa Indonesia — Paket 01</h2><small>Bahasa Indonesia · 25 soal · 75 menit</small></div><div class="exam-timer">${icon('clock')}<div><small>SISA WAKTU</small><strong>01:12:34</strong></div></div></div><div class="exam-main" style="--question-size:${questionSize}px"><section><div class="row spread exam-mobile-panel" style="margin-bottom:15px"><strong style="font-size:12px">Bahasa Indonesia · 25 soal</strong>${button('Daftar soal','grid','data-action="examNav"')}</div><article class="card"><div class="card-head" style="border-bottom:1px solid var(--line)"><div class="row"><h2>Soal ${String(examNumber).padStart(2,'0')} <span class="muted" style="font-size:11px;font-weight:400">/ 25</span></h2>${tag('Pilihan ganda')}</div><div class="row"><button class="icon-btn" data-action="fontMinus" aria-label="Perkecil teks">A−</button><button class="icon-btn" data-action="fontPlus" aria-label="Perbesar teks">A+</button></div></div><div class="exam-section"><div class="row muted" style="font-size:11px">${icon('info')}Pilih satu jawaban yang paling tepat.</div><section class="exam-reading"><small style="font-size:9px;letter-spacing:1.5px;color:#8ba0bf">BACAAN · BAHASA INDONESIA</small><h3 style="font-size:17px;margin-top:9px;color:#42638f">Halaman Sekolah yang Hijau</h3><p>Setiap Jumat, siswa bersama-sama merawat tanaman di halaman sekolah. Mereka menyiram bunga, membersihkan daun yang gugur, dan menanam bibit pohon baru.</p><p>Kegiatan sederhana ini mengajarkan siswa untuk peduli terhadap lingkungan. Mereka belajar bahwa merawat alam dapat dimulai dari kebiasaan kecil yang dilakukan bersama.</p></section><p class="exam-question">Apa manfaat utama kegiatan merawat tanaman dalam bacaan tersebut?</p>${['Menumbuhkan kepedulian terhadap lingkungan.','Mengurangi waktu belajar siswa di dalam kelas.','Mengganti seluruh kegiatan belajar dengan berkebun.','Membuat siswa membawa tanaman dari rumah.'].map((t,i)=>`<label class="answer"><b>${'ABCD'[i]}</b><span>${t}</span><input type="radio" name="exam-answer" value="${i}" aria-label="Pilihan ${'ABCD'[i]}" ${answers[examNumber]===i?'checked':''}></label>`).join('')}<div class="exam-sync">${icon('check')}${answers[examNumber]!==undefined?'Pilihan tersimpan dalam pratinjau ini.':'Pilih jawaban untuk mencoba tampilan.'}</div></div><div class="exam-bottom">${button('Sebelumnya','','data-action="previousQuestion"')}${button(review.has(examNumber)?'Ditandai untuk ditinjau':'Tandai untuk ditinjau','flag','data-action="reviewQuestion"')}${button('Selanjutnya','chevron','data-action="nextQuestion"',true)}</div></article><p class="caption">Contoh soal yang sama digunakan pada navigasi pratinjau. Timer dan penyimpanan di sini adalah ilustrasi.</p></section><aside class="exam-aside">${examIdentity()}</aside></div>`}
function result(){return publicNav()+`<main class="result-wrap"><section class="card result-card"><div class="result-icon">${icon('check')}</div><div class="eyebrow">TRY OUT BAHASA INDONESIA</div><h1>Try out selesai.</h1><p>Terima kasih sudah mengerjakan dengan sungguh-sungguh. Selamat melanjutkan langkah belajarmu.</p>${tag('Selesai','green')}<div class="result-score"><strong style="${resultDeferred?'font-size:25px':''}">${resultDeferred?'Menunggu rilis':'84 <span style="font-size:18px;color:#9cafca">/ 100</span>'}</strong><small>${resultDeferred?'Nilai akan diumumkan oleh penyelenggara.':'Contoh tampilan nilai ketika rilis langsung diaktifkan.'}</small></div><dl class="detail-list" style="text-align:left;margin:25px 0"><dt>Nama peserta</dt><dd>Ahmad Fadli</dd><dt>Sekolah</dt><dd>${school}</dd></dl>${button('Kembali ke beranda','arrow','data-public style="width:100%"',true)}<div class="state-control" style="justify-content:center"><span>Pratinjau nilai:</span><button data-action="scoreDirect">Langsung</button><button data-action="scoreDeferred">Ditunda</button></div></section>${footer()}</main>`}
function settings(){return heading('Pengaturan ujian','Pengaturan pelaksanaan saat ini dikelola pada masing-masing paket.','','SUPER ADMIN')+`<section class="card"><div class="empty"><span class="stat-icon">${icon('settings')}</span><h3>Kelola pengaturan melalui paket try out</h3><p>Durasi, mata pelajaran, pilihan soal, dan rilis nilai tersedia pada formulir paket.</p>${button('Buka paket try out','package','data-page="packages"',true)}</div></section>`}

 case 'password':openModal('Atur ulang password siswa?',`<p>Password baru akan diberikan kepada siswa melalui kartu login. Pada pratinjau ini tidak ada akun yang diubah.</p>`,button('Batal','','data-action="closeModal"')+button('Atur ulang','key','data-action="demoResetPassword"',true));break;

 case 'demoDelete':$('modal').close();toast('Simulasi penghapusan. Data aplikasi tetap utuh.');break;
 case 'questionPreview':openModal('Pratinjau soal',`<div style="font-size:15px;line-height:1.9;color:#587294">${initialCopy}</div>${['90°','180°','270°','360°'].map((o,i)=>`<div class="answer"><b>${'ABCD'[i]}</b>${o}</div>`).join('')}`);break;
 case 'detail':openModal('Detail data',`<dl class="detail-list"><dt>Nama</dt><dd>${page==='packages'?'Try Out Matematika — Paket 01':page==='schools'?school:'Dewi Anggraini'}</dd><dt>${page==='packages'?'Mata pelajaran':'Sekolah'}</dt><dd>${page==='packages'?'Matematika':school}</dd><dt>Status</dt><dd>${tag(page==='packages'?'Aktif':'Terdaftar','green')}</dd></dl>`);break;
 case 'refresh':toast('Tampilan data contoh telah diperbarui.');break;
 case 'reset':query='';filter='';tableState='normal';pageNumber=1;render();break;
 case 'sort':sortAsc=!sortAsc;fillTable();break;
 case 'csv':{const c=tableConfig();if(!c||tableState!=='normal')return toast('Tunggu hingga data berhasil dimuat.');const data=filteredRows(c).map(v=>v.r),csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='contoh-pratinjau-totka.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV data contoh diunduh sesuai filter.');break;}
 case 'access':if(role!=='public')goto('public');requestAnimationFrame(()=>$('akses')?.scrollIntoView({behavior:'smooth'}));break;
 case 'togglePassword':{const input=$('password-input');input.type=input.type==='password'?'text':'password';document.querySelector('[data-action="togglePassword"]').setAttribute('aria-label',input.type==='password'?'Tampilkan password':'Sembunyikan password');break;}
 case 'reviewQuestion':review.has(examNumber)?review.delete(examNumber):review.add(examNumber);render();break;
 case 'nextQuestion':examNumber=Math.min(25,examNumber+1);render();break;
 case 'previousQuestion':examNumber=Math.max(1,examNumber-1);render();break;
 case 'fontPlus':questionSize=Math.min(22,questionSize+1);render();break;
 case 'fontMinus':questionSize=Math.max(15,questionSize-1);render();break;
 case 'examNav':openModal('Peserta & navigasi soal',examIdentity());break;
 case 'finish':openModal('Periksa sebelum menyelesaikan',`<p>Tinjau jawaban dan penanda soal sebelum mengakhiri try out.</p><div class="line-item"><span>Terjawab</span><strong>${Object.keys(answers).length} dari 25 soal</strong></div><div class="line-item"><span>Belum dijawab</span><strong>${25-Object.keys(answers).length} soal</strong></div><div class="line-item"><span>Ditandai untuk ditinjau</span><strong>${review.size} soal</strong></div><div class="gap">${notice('Ini simulasi penyelesaian untuk melihat tampilan hasil.')}</div>`,button('Kembali mengerjakan','','data-action="closeModal"')+button('Selesaikan try out','check','data-action="confirmFinish"',true));break;
 case 'confirmFinish':$('modal').close();goto('siswa','result');break;
 case 'scoreDirect':resultDeferred=false;render();break;
 case 'scoreDeferred':resultDeferred=true;render();break;
 }}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b){if(event.target.id==='scrim')handleAction('menu');return}if(b.disabled)return;if(b.dataset.action)handleAction(b.dataset.action);else if(b.dataset.page)goto(role,b.dataset.page);else if(b.hasAttribute('data-public'))goto('public');else if(b.dataset.login){loginRole=b.dataset.login;goto('login')}else if(b.dataset.report){report=b.dataset.report;query='';filter='';pageNumber=1;tableState='normal';render()}else if(b.dataset.state){tableState=b.dataset.state;render()}else if(b.dataset.paginate){pageNumber=Number(b.dataset.paginate);fillTable()}else if(b.dataset.question){examNumber=Number(b.dataset.question);$('modal').close();render()}else if(b.dataset.demo)toast(b.dataset.demo)});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='table-search'){query=el.value;pageNumber=1;fillTable()}if(el.id==='editor-copy'){// Copy only the locally authored DOM; drop pasted markup before showing it.
 const source=document.createElement('div');source.innerHTML=el.innerHTML;source.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());source.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||a.name==='src'||a.name==='href')n.removeAttribute(a.name)}));$('copy-preview').replaceChildren(...source.childNodes);
 }if(el.classList.contains('option-copy'))$('option-preview').querySelectorAll('.answer span')[Number(el.dataset.option)].textContent=el.value});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='role-view')goto(el.value);if(el.id==='login-role'){loginRole=el.value;render()}if(el.id==='table-filter'){filter=el.value;pageNumber=1;fillTable()}if(el.id==='page-size'){pageSize=Number(el.value);pageNumber=1;fillTable()}if(el.id==='package-subject')fillPackage();if(el.name==='question')$('selected-count').textContent=document.querySelectorAll('input[name=question]:checked').length+' soal';if(el.id==='editor-size'){$('editor-copy').style.fontSize=el.value+'px';$('copy-preview').style.fontSize=el.value+'px'}if(el.name==='exam-answer'){answers[examNumber]=Number(el.value);render()}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='login-form')goto(loginRole);else if(event.target.id==='token-form')goto('siswa','exam');else if(event.target.id==='demo-form'){$('modal').close();toast('Formulir berhasil disimulasikan. Tidak ada data aplikasi yang diubah.')}else if(event.target.id==='package-form'){toast('Contoh paket berhasil disusun. Tidak disimpan ke aplikasi.');goto('admin','packages')}});
// Treat pasted editor text as plain text; no external scripts or media are loaded.
document.addEventListener('paste',event=>{if(!event.target.closest('#editor-copy'))return;event.preventDefault();const text=event.clipboardData?.getData('text/plain')||'',selection=getSelection();if(selection?.rangeCount){const range=selection.getRangeAt(0);range.deleteContents();const node=document.createTextNode(text);range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);$('editor-copy').dispatchEvent(new Event('input',{bubbles:true}))}});
$('modal').addEventListener('click',event=>{if(event.target!==$('modal'))return;const r=$('modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('modal').close()});
function setDevice(phone){document.body.classList.toggle('phone',phone);$('phone').classList.toggle('active',phone);$('desktop').classList.toggle('active',!phone);$('phone').setAttribute('aria-pressed',String(phone));$('desktop').setAttribute('aria-pressed',String(!phone))}
$('about').innerHTML=icon('info')+'<span class="about-label">Panduan</span>';$('about').style.display='inline-flex';$('about').style.alignItems='center';$('about').style.gap='5px';$('phone').innerHTML=icon('phone');$('desktop').innerHTML=icon('monitor');$('phone').onclick=()=>setDevice(true);$('desktop').onclick=()=>setDevice(false);
